<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Road Tech Tracker — Irlequip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8102E;
    --black:#111111;
    --white:#ffffff;
    --grey-50:#f7f7f8;
    --grey-100:#eceef0;
    --grey-300:#cdd2d8;
    --grey-500:#8a929b;
    --grey-700:#4a4f55;
    --ok:#1f9d55;
    --warn:#e07b0f;
    --shadow: 0 2px 10px rgba(17,17,17,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans', system-ui, sans-serif;
    background:var(--grey-50);
    color:var(--black);
  }
  header{
    background:var(--black);
    color:var(--white);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.2px;
  }
  header .brand .dot{
    width:10px;height:10px;border-radius:50%;background:var(--red);
  }
  header .actions{
    display:flex;gap:8px;align-items:center;
  }
  .btn{
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--red);color:var(--white);}
  .btn-ghost{background:rgba(255,255,255,0.1);color:var(--white);}
  .btn-secondary{background:var(--grey-100);color:var(--black);}
  main{
    max-width:1200px;
    margin:0 auto;
    padding:20px 24px 60px;
  }
  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    flex-wrap:wrap;
    gap:10px;
  }
  .view-toggle{
    display:flex;
    background:var(--grey-100);
    border-radius:8px;
    padding:3px;
  }
  .view-toggle button{
    border:none;background:transparent;padding:7px 14px;border-radius:6px;
    font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--grey-700);
  }
  .view-toggle button.active{background:var(--white);color:var(--black);box-shadow:var(--shadow);}
  #status-line{font-size:13px;color:var(--grey-500);}
  .layout{
    display:grid;
    grid-template-columns:minmax(280px, 460px) 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
  }
  .card-panel{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px;
  }
  #map-wrap{position:relative;}
  #ireland-map{width:100%;height:auto;display:block;}
  .county-dot{fill:var(--grey-300);stroke:var(--white);stroke-width:1.5;cursor:pointer;transition:fill .15s;}
  .county-dot:hover{fill:var(--grey-500);}
  .county-dot.has-tech{fill:#f3c6cd;}
  .county-label{font-size:6px;fill:var(--grey-700);pointer-events:none;font-family:'DM Sans',sans-serif;}
  .tech-marker{cursor:pointer;}
  .tech-marker circle.avatar-bg{fill:var(--red);stroke:var(--white);stroke-width:1.4;}
  .tech-marker text.avatar-initial{fill:var(--white);font-size:6.5px;font-weight:700;text-anchor:middle;}
  .tech-marker.status-Travelling circle.avatar-bg{fill:var(--warn);}
  .tech-marker.status-Waiting-on-parts circle.avatar-bg{fill:#7a5cc4;}
  .tech-marker.status-Completed circle.avatar-bg{fill:var(--ok);}
  .tech-marker.status-Off circle.avatar-bg{fill:var(--grey-500);}
  .tech-list{list-style:none;margin:0;padding:0;}
  .tech-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .tech-row:hover{background:var(--grey-50);border-color:var(--grey-100);}
  .avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--red);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;flex-shrink:0;
  }
  .status-pill{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    background:#f3c6cd;color:var(--red);white-space:nowrap;
  }
  .status-pill.status-Travelling{background:#fbe3c6;color:var(--warn);}
  .status-pill.status-Waiting-on-parts{background:#e6ddf7;color:#5c3fa3;}
  .status-pill.status-Completed{background:#d4f0de;color:var(--ok);}
  .status-pill.status-Off{background:var(--grey-100);color:var(--grey-700);}
  .tech-meta{font-size:12.5px;color:var(--grey-500);margin-top:2px;}
  .tech-name{font-weight:600;font-size:14.5px;}
  .table-view table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .table-view th{text-align:left;color:var(--grey-500);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:2px solid var(--grey-100);}
  .table-view td{padding:10px;border-bottom:1px solid var(--grey-100);}
  .table-view tr:hover{background:var(--grey-50);cursor:pointer;}
  .empty-note{color:var(--grey-500);font-size:13.5px;padding:20px;text-align:center;}
  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(17,17,17,0.5);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{
    background:var(--white);border-radius:14px;padding:24px;
    width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,0.25);
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{margin:0 0 4px;font-size:18px;}
  .modal .subtitle{color:var(--grey-500);font-size:13px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--grey-700);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1.5px solid var(--grey-100);border-radius:8px;
    font-family:inherit;font-size:14px;background:var(--grey-50);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:20px;}
  .modal-actions .left{display:flex;gap:8px;}
  .hint{font-size:12px;color:var(--grey-500);margin-top:10px;}
  a.trello-link{color:var(--red);font-weight:600;text-decoration:none;font-size:13px;}
  [hidden]{display:none!important;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> Irlequip — Road Tech Tracker</div>
  <div class="actions">
    <span id="status-line" style="color:rgba(255,255,255,.6);"></span>
    <button class="btn btn-ghost" id="refresh-btn">Refresh</button>
    <button class="btn btn-primary" id="add-btn">+ Add technician</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="view-toggle">
      <button id="tab-map" class="active">Map</button>
      <button id="tab-list">List</button>
    </div>
  </div>

  <div id="map-view" class="layout">
    <div class="card-panel" id="map-wrap">
      <svg id="ireland-map" viewBox="0 0 400 400"></svg>
    </div>
    <div class="card-panel">
      <h3 style="margin-top:0;">On the road</h3>
      <ul class="tech-list" id="tech-list"></ul>
      <p class="empty-note" id="empty-note" hidden>No technicians logged yet. Click "+ Add technician" to get started.</p>
    </div>
  </div>

  <div id="list-view" class="card-panel table-view" hidden>
    <table>
      <thead>
        <tr><th>Technician</th><th>County</th><th>Customer</th><th>Machine</th><th>Status</th><th>Updated</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</main>

<!-- Add / Edit modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal">
    <h2 id="modal-title">Add technician</h2>
    <div class="subtitle" id="modal-subtitle">Log where they are and what they're on.</div>

    <div class="field">
      <label>Technician name</label>
      <input type="text" id="f-name" placeholder="e.g. Sean Byrne" />
    </div>
    <div class="field">
      <label>County</label>
      <select id="f-county"></select>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option>On site</option>
        <option>Travelling</option>
        <option>Waiting on parts</option>
        <option>Completed</option>
        <option>Off</option>
      </select>
    </div>
    <div class="field">
      <label>Customer</label>
      <input type="text" id="f-customer" placeholder="e.g. Roadstone Ltd" />
    </div>
    <div class="field">
      <label>Machine</label>
      <input type="text" id="f-machine" placeholder="e.g. Potain MDT 178 tower crane" />
    </div>
    <div class="field">
      <label>Problem / job notes</label>
      <textarea id="f-problem" placeholder="What's the job?"></textarea>
    </div>

    <div class="hint" id="modal-updated"></div>

    <div class="modal-actions">
      <div class="left">
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button class="btn btn-secondary" id="archive-btn" hidden>Remove</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <a class="trello-link" id="trello-link" href="#" target="_blank" hidden>Open in Trello ↗</a>
        <button class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
const COUNTIES = [
  { code:'DON', name:'Donegal',   x:130, y:55  },
  { code:'DER', name:'Derry',     x:213, y:65  },
  { code:'ANT', name:'Antrim',    x:288, y:70  },
  { code:'TYR', name:'Tyrone',    x:203, y:100 },
  { code:'FER', name:'Fermanagh', x:163, y:117 },
  { code:'DOW', name:'Down',      x:298, y:125 },
  { code:'ARM', name:'Armagh',    x:248, y:130 },
  { code:'MON', name:'Monaghan',  x:218, y:146 },
  { code:'CAV', name:'Cavan',     x:174, y:151 },
  { code:'SLI', name:'Sligo',     x:108, y:136 },
  { code:'LEI', name:'Leitrim',   x:148, y:141 },
  { code:'MAY', name:'Mayo',      x:62,  y:172 },
  { code:'ROS', name:'Roscommon', x:138, y:187 },
  { code:'GAL', name:'Galway',    x:92,  y:227 },
  { code:'LNG', name:'Longford',  x:172, y:191 },
  { code:'WEM', name:'Westmeath', x:192, y:206 },
  { code:'LOU', name:'Louth',     x:257, y:171 },
  { code:'MEA', name:'Meath',     x:232, y:201 },
  { code:'DUB', name:'Dublin',    x:263, y:227 },
  { code:'KID', name:'Kildare',   x:227, y:237 },
  { code:'OFF', name:'Offaly',    x:192, y:236 },
  { code:'LAO', name:'Laois',     x:207, y:251 },
  { code:'WIC', name:'Wicklow',   x:252, y:257 },
  { code:'CAR', name:'Carlow',    x:232, y:271 },
  { code:'KIK', name:'Kilkenny',  x:207, y:281 },
  { code:'WEX', name:'Wexford',   x:257, y:296 },
  { code:'CLA', name:'Clare',     x:97,  y:266 },
  { code:'TIP', name:'Tipperary', x:172, y:271 },
  { code:'LIM', name:'Limerick',  x:127, y:296 },
  { code:'WAT', name:'Waterford', x:197, y:306 },
  { code:'KER', name:'Kerry',     x:72,  y:321 },
  { code:'COR', name:'Cork',      x:137, y:341 },
];

let technicians = [];
let editingId = null;
let currentView = 'map';

const $ = (sel) => document.querySelector(sel);

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('');
}

function statusClass(status){
  return 'status-' + (status || 'On site').replace(/\s+/g,'-');
}

function buildMap(){
  const svg = $('#ireland-map');
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  // soft backdrop suggesting the island outline (schematic, not geographic)
  const bg = document.createElementNS(ns,'ellipse');
  bg.setAttribute('cx','185'); bg.setAttribute('cy','205');
  bg.setAttribute('rx','175'); bg.setAttribute('ry','195');
  bg.setAttribute('fill','#f0f2f4');
  svg.appendChild(bg);

  COUNTIES.forEach(c => {
    const g = document.createElementNS(ns,'g');

    const dot = document.createElementNS(ns,'circle');
    dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y); dot.setAttribute('r', 9);
    dot.setAttribute('class','county-dot');
    dot.dataset.county = c.name;
    dot.addEventListener('click', () => openAddModalForCounty(c.name));
    g.appendChild(dot);

    const label = document.createElementNS(ns,'text');
    label.setAttribute('x', c.x); label.setAttribute('y', c.y + 15);
    label.setAttribute('text-anchor','middle');
    label.setAttribute('class','county-label');
    label.textContent = c.code;
    g.appendChild(label);

    svg.appendChild(g);
  });
}

function renderMarkers(){
  const svg = $('#ireland-map');
  svg.querySelectorAll('.tech-marker').forEach(el => el.remove());
  svg.querySelectorAll('.county-dot').forEach(el => el.classList.remove('has-tech'));

  const byCounty = {};
  technicians.forEach(t => {
    const key = t.county || 'Unassigned';
    byCounty[key] = byCounty[key] || [];
    byCounty[key].push(t);
  });

  const ns = 'http://www.w3.org/2000/svg';
  Object.entries(byCounty).forEach(([countyName, list]) => {
    const county = COUNTIES.find(c => c.name === countyName);
    if (!county) return;
    svg.querySelector(`.county-dot[data-county="${countyName}"]`)?.classList.add('has-tech');

    list.forEach((t, i) => {
      const angle = (i / Math.max(list.length,1)) * Math.PI * 2;
      const offset = list.length > 1 ? 13 : 0;
      const mx = county.x + Math.cos(angle) * offset;
      const my = county.y - 16 + Math.sin(angle) * offset * 0.6;

      const g = document.createElementNS(ns,'g');
      g.setAttribute('class', 'tech-marker ' + statusClass(t.status));
      g.setAttribute('transform', `translate(${mx},${my})`);
      g.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(t); });

      const circle = document.createElementNS(ns,'circle');
      circle.setAttribute('r','7.5');
      circle.setAttribute('class','avatar-bg');
      g.appendChild(circle);

      const text = document.createElementNS(ns,'text');
      text.setAttribute('class','avatar-initial');
      text.setAttribute('y','2.3');
      text.textContent = initials(t.name);
      g.appendChild(text);

      svg.appendChild(g);
    });
  });
}

function renderList(){
  const list = $('#tech-list');
  list.innerHTML = '';
  $('#empty-note').hidden = technicians.length > 0;

  technicians.forEach(t => {
    const li = document.createElement('li');
    li.className = 'tech-row';
    li.innerHTML = `
      <div class="avatar">${initials(t.name)}</div>
      <div style="flex:1;min-width:0;">
        <div class="tech-name">${escapeHtml(t.name)}</div>
        <div class="tech-meta">${escapeHtml(t.county || 'No county set')}${t.customer ? ' · ' + escapeHtml(t.customer) : ''}</div>
      </div>
      <span class="status-pill ${statusClass(t.status)}">${escapeHtml(t.status || 'On site')}</span>
    `;
    li.addEventListener('click', () => openEditModal(t));
    list.appendChild(li);
  });
}

function renderTable(){
  const body = $('#table-body');
  body.innerHTML = '';
  if (technicians.length === 0) {
    body.innerHTML = '<tr><td colspan="6" class="empty-note">No technicians logged yet.</td></tr>';
    return;
  }
  technicians.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(t.name)}</td>
      <td>${escapeHtml(t.county || '—')}</td>
      <td>${escapeHtml(t.customer || '—')}</td>
      <td>${escapeHtml(t.machine || '—')}</td>
      <td><span class="status-pill ${statusClass(t.status)}">${escapeHtml(t.status || 'On site')}</span></td>
      <td>${formatTime(t.updated)}</td>
    `;
    tr.addEventListener('click', () => openEditModal(t));
    body.appendChild(tr);
  });
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatTime(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffH =
